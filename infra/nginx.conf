# /etc/nginx/sites-available/pleiades  (symlink into sites-enabled)
# Replace server_name with your host (e.g. 203-0-113-7.sslip.io), then run:
#   sudo certbot --nginx -d <host>
# certbot adds the TLS server block and the HTTP->HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name _;  # e.g. 203-0-113-7.sslip.io

    root /opt/pleiades/frontend/dist;
    index index.html;

    # Photos go straight to Vultr Object Storage via presigned URLs; API bodies are small.
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/geo+json application/javascript text/css text/plain image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build assets: cache aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
